server:
  port: ${PORT:8083}

spring:
  application:
    name: atractivos
  datasource:
    # DB_URL completa, o bien DB_HOST/DB_PORT/DB_NAME (Render las inyecta desde el Blueprint).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tamaka}}
    username: ${DB_USER:tamaka_atractivos}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: atractivos
  flyway:
    schemas: atractivos

tamaka:
  security:
    jwt:
      issuer: tamaka-cuentas
      public-key: ${TAMAKA_JWT_PUBLIC_KEY:}
