server:
  port: ${PORT:8087}

spring:
  application:
    name: preferencias
  # Spring Boot 4 lee la conexion de spring.mongodb.* (spring.data.mongodb.uri se ignora).
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/tamaka_preferencias}

tamaka:
  security:
    jwt:
      issuer: tamaka-cuentas
      public-key: ${TAMAKA_JWT_PUBLIC_KEY:}
  # Bus de eventos (tamaka-common). "http": POST a /internal/eventos de cada suscriptor;
  # "log": solo registra. El secreto debe ser el mismo en todos los servicios (vacio = fail closed).
  eventos:
    transporte: ${TAMAKA_EVENTOS_TRANSPORTE:http}
    secreto: ${TAMAKA_EVENTOS_SECRETO:}
    timeout: 5s
    reintentos: 3
    suscriptores:
      PreferenciasActualizadas: ${RECOMENDACIONES_URL:http://localhost:8088}/internal/eventos,${NOTIFICACIONES_URL:http://localhost:8089}/internal/eventos
      FavoritoGuardado: ${NOTIFICACIONES_URL:http://localhost:8089}/internal/eventos
      FavoritoEliminado: ${NOTIFICACIONES_URL:http://localhost:8089}/internal/eventos
    # Outbox transaccional: el evento se guarda con el cambio de estado y el relay lo entrega con reintentos.
    outbox:
      habilitado: ${TAMAKA_OUTBOX_HABILITADO:true}
      almacen: mongo
      coleccion: outbox_evento
      lote: 50
      intervalo: PT2S
      espera-base: PT2S
      espera-maxima: PT10M
      max-intentos: 10
