# Stack completo de TAMAKA en una sola maquina con Docker:
# PostgreSQL, MongoDB, Redis, los 10 microservicios y el gateway nginx.
#
# Uso (desde la raiz del repositorio):
#   ./infra/generar-secretos.sh            # crea el .env con claves JWT y secretos aleatorios
#   docker compose up -d --build
#   curl http://localhost/api/eventos       # entrada unica: el gateway (puerto TAMAKA_HTTP_PORT)
#
# Solo el gateway publica un puerto. Las bases y los servicios quedan en la red interna;
# /internal/eventos (bus de eventos) no se expone hacia fuera.
#
# Para ejecutar solo los almacenes y levantar los servicios desde el IDE:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
#
# Para depurar un servicio desde el host, anade su puerto al servicio correspondiente, por ejemplo:
#   cuentas:
#     ports: ["8081:8081"]

# Variables comunes a los 10 microservicios.
x-entorno-comun: &entorno-comun
  # Ajustes para 10 JVM en una sola maquina pequena: JIT solo C1 (arranque mucho mas barato en CPU),
  # code cache y pila de hilos reducidos para dejar memoria fuera del heap. Sobrescribible por .env.
  JAVA_OPTS: ${TAMAKA_JAVA_OPTS:--XX:MaxRAMPercentage=65 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -XX:+ExitOnOutOfMemoryError -Xss512k -Dfile.encoding=UTF-8}
  TAMAKA_JWT_PUBLIC_KEY: ${TAMAKA_JWT_PUBLIC_KEY:?Defina TAMAKA_JWT_PUBLIC_KEY (./infra/generar-secretos.sh)}
  TAMAKA_EVENTOS_SECRETO: ${TAMAKA_EVENTOS_SECRETO:?Defina TAMAKA_EVENTOS_SECRETO}
  TAMAKA_EVENTOS_TRANSPORTE: http
  # Suscriptores del bus: nombres de servicio de la red docker.
  COMERCIOS_URL: http://comercios:8082
  RESERVAS_URL: http://reservas:8085
  PAGOS_URL: http://pagos:8086
  RECOMENDACIONES_URL: http://recomendaciones:8088
  NOTIFICACIONES_URL: http://notificaciones:8089
  INDICADORES_URL: http://indicadores:8090
  # Bucket publico de imagenes (Cloudflare R2, compatible con S3). Vacio = subida deshabilitada (503).
  TAMAKA_STORAGE_ENDPOINT: ${R2_S3_API:-}
  TAMAKA_STORAGE_BUCKET: ${R2_BUCKET_NAME:-}
  TAMAKA_STORAGE_PUBLIC_BASE_URL: ${R2_DOMAIN:-}
  TAMAKA_STORAGE_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  TAMAKA_STORAGE_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}

# PostgreSQL: misma base "tamaka", un esquema y un usuario por servicio (infra/postgres/01-esquemas.sh).
x-entorno-postgres: &entorno-postgres
  DB_URL: jdbc:postgresql://postgres:5432/tamaka
  DB_PASSWORD: ${TAMAKA_DB_PASSWORD:?Defina TAMAKA_DB_PASSWORD}

x-depende-postgres: &depende-postgres
  postgres:
    condition: service_healthy

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-servicio: &servicio
  restart: unless-stopped
  mem_limit: ${TAMAKA_MEMORIA_SERVICIO:-384m}
  networks: [tamaka]
  # Margen para que el contenedor termine las peticiones en vuelo al recibir SIGTERM.
  stop_grace_period: 30s
  logging: *logging

services:
  # ---------------------------------------------------------------- almacenes
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    networks: [tamaka]
    environment:
      POSTGRES_DB: tamaka
      POSTGRES_USER: tamaka_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Defina POSTGRES_ADMIN_PASSWORD}
      TAMAKA_DB_PASSWORD: ${TAMAKA_DB_PASSWORD:?Defina TAMAKA_DB_PASSWORD}
    volumes:
      - ./infra/postgres/01-esquemas.sh:/docker-entrypoint-initdb.d/01-esquemas.sh:ro
      - postgres-datos:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamaka_admin -d tamaka"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  mongo:
    image: mongo:8
    restart: unless-stopped
    networks: [tamaka]
    volumes:
      - mongo-datos:/data/db
    healthcheck:
      # Chequeo TCP ligero: mongosh es un proceso Node que, con la CPU ocupada por las JVM
      # arrancando, supera los 30 s y deja a Mongo "unhealthy" bloqueando a sus dependientes.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/27017' || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 30s
    logging: *logging

  redis:
    # Solo cache de recomendaciones (reconstruible desde eventos): sin persistencia.
    image: redis:7-alpine
    restart: unless-stopped
    networks: [tamaka]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  # ---------------------------------------------------------- microservicios
  # Los 10 comparten la misma capa de dependencias Maven (mismo pom.xml y mismos comandos),
  # asi que el multi-modulo se compila una vez y el resto de imagenes reusan la cache.
  cuentas:
    <<: *servicio
    build: {context: ., dockerfile: cuentas/Dockerfile}
    environment:
      <<: [*entorno-comun, *entorno-postgres]
      DB_USER: tamaka_cuentas
      TAMAKA_JWT_PRIVATE_KEY: ${TAMAKA_JWT_PRIVATE_KEY:?Defina TAMAKA_JWT_PRIVATE_KEY}
    depends_on: *depende-postgres
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 180s

  comercios:
    <<: *servicio
    build: {context: ., dockerfile: comercios/Dockerfile}
    environment:
      <<: [*entorno-comun, *entorno-postgres]
      DB_USER: tamaka_comercios
    depends_on: *depende-postgres
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 180s

  atractivos:
    <<: *servicio
    build: {context: ., dockerfile: atractivos/Dockerfile}
    environment:
      <<: [*entorno-comun, *entorno-postgres]
      DB_USER: tamaka_atractivos
    depends_on: *depende-postgres
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8083' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 180s

  eventos:
    <<: *servicio
    build: {context: ., dockerfile: eventos/Dockerfile}
    environment:
      <<: [*entorno-comun, *entorno-postgres]
      DB_USER: tamaka_eventos
    depends_on: *depende-postgres
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8084' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 180s

  reservas:
    <<: *servicio
    build: {context: ., dockerfile: reservas/Dockerfile}
    environment:
      <<: [*entorno-comun, *entorno-postgres]
      DB_USER: tamaka_reservas
    depends_on:
      postgres:
        condition: service_healthy
      # Consulta HTTP puntual a Comercios al crear reservas.
      comercios:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8085' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 180s

  pagos:
    <<: *servicio
    build: {context: ., dockerfile: pagos/Dockerfile}
    environment:
      <<: [*entorno-comun, *entorno-postgres]
      DB_USER: tamaka_pagos
      PAGOS_WEBHOOK_SECRET: ${PAGOS_WEBHOOK_SECRET:-}
      # Mock/sandbox: true = aprobacion instantanea al iniciar (por defecto true). false con pasarela real.
      TAMAKA_PAGOS_APROBACION_AUTOMATICA: ${TAMAKA_PAGOS_APROBACION_AUTOMATICA:-true}
    depends_on: *depende-postgres
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8086' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 180s

  preferencias:
    <<: *servicio
    build: {context: ., dockerfile: preferencias/Dockerfile}
    environment:
      <<: *entorno-comun
      MONGO_URI: mongodb://mongo:27017/tamaka_preferencias
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8087' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 180s

  recomendaciones:
    <<: *servicio
    build: {context: ., dockerfile: recomendaciones/Dockerfile}
    environment:
      <<: *entorno-comun
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8088' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 180s

  notificaciones:
    <<: *servicio
    build: {context: ., dockerfile: notificaciones/Dockerfile}
    environment:
      <<: *entorno-comun
      MONGO_URI: mongodb://mongo:27017/tamaka_notificaciones
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8089' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 180s

  indicadores:
    <<: *servicio
    build: {context: ., dockerfile: indicadores/Dockerfile}
    environment:
      <<: [*entorno-comun, *entorno-postgres]
      DB_USER: tamaka_indicadores
    depends_on: *depende-postgres
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 180s

  # ------------------------------------------------------------------ gateway
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [tamaka]
    ports:
      - "${TAMAKA_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/gateway/cors-preflight.inc:/etc/nginx/snippets/cors-preflight.inc:ro
    depends_on:
      cuentas: {condition: service_healthy}
      comercios: {condition: service_healthy}
      atractivos: {condition: service_healthy}
      eventos: {condition: service_healthy}
      reservas: {condition: service_healthy}
      pagos: {condition: service_healthy}
      preferencias: {condition: service_healthy}
      recomendaciones: {condition: service_healthy}
      notificaciones: {condition: service_healthy}
      indicadores: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

networks:
  tamaka: {}

volumes:
  postgres-datos: {}
  mongo-datos: {}
