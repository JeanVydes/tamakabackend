# Blueprint de Render: base PostgreSQL compartida (un esquema por servicio), Key Value y servicios web.
# Los secretos (sync: false) se introducen en el dashboard; no van en este archivo.
databases:
  - name: tamaka-cuentas-db
    databaseName: tamaka_cuentas
    user: tamaka_cuentas
    plan: free
    region: oregon
    postgresMajorVersion: "18"

envVarGroups:
  - name: tamaka-jwt-publica
    envVars:
      - key: TAMAKA_JWT_PUBLIC_KEY
        sync: false

services:
  - type: keyvalue
    name: tamaka-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # solo conexiones internas desde los servicios de TAMAKA

  - type: web
    name: tamaka-cuentas
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerContext: .
    dockerfilePath: ./cuentas/Dockerfile
    autoDeploy: false
    envVars:
      - fromGroup: tamaka-jwt-publica
      - key: TAMAKA_JWT_PRIVATE_KEY
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: tamaka-cuentas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tamaka-cuentas-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: tamaka-cuentas-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: tamaka-cuentas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tamaka-cuentas-db
          property: password

  - type: web
    name: tamaka-comercios
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerContext: .
    dockerfilePath: ./comercios/Dockerfile
    autoDeploy: false
    envVars:
      - fromGroup: tamaka-jwt-publica
      - key: DB_HOST
        fromDatabase:
          name: tamaka-cuentas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tamaka-cuentas-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: tamaka-cuentas-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: tamaka-cuentas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tamaka-cuentas-db
          property: password

  - type: web
    name: tamaka-atractivos
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerContext: .
    dockerfilePath: ./atractivos/Dockerfile
    autoDeploy: false
    envVars:
      - fromGroup: tamaka-jwt-publica
      - key: DB_HOST
        fromDatabase:
          name: tamaka-cuentas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tamaka-cuentas-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: tamaka-cuentas-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: tamaka-cuentas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tamaka-cuentas-db
          property: password

  - type: web
    name: tamaka-eventos
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerContext: .
    dockerfilePath: ./eventos/Dockerfile
    autoDeploy: false
    envVars:
      - fromGroup: tamaka-jwt-publica
      - key: DB_HOST
        fromDatabase:
          name: tamaka-cuentas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tamaka-cuentas-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: tamaka-cuentas-db
