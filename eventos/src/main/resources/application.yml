server:
  port: ${PORT:8084}

spring:
  application:
    name: eventos
  datasource:
    # DB_URL completa, o bien DB_HOST/DB_PORT/DB_NAME (Render las inyecta desde el Blueprint).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tamaka}}
    username: ${DB_USER:tamaka_eventos}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      # Subida de portadas: 5 MB como maximo y 5 MB por peticion (valida tambien el servicio)
      max-file-size: 5MB
      max-request-size: 5MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: eventos
  flyway:
    schemas: eventos

tamaka:
  security:
    jwt:
      issuer: tamaka-cuentas
      public-key: ${TAMAKA_JWT_PUBLIC_KEY:}
  storage:
    # Bucket publico de imagenes (Cloudflare R2, compatible con S3). Vacio = subida deshabilitada (503).
    endpoint: ${TAMAKA_STORAGE_ENDPOINT:}
    bucket: ${TAMAKA_STORAGE_BUCKET:}
    public-base-url: ${TAMAKA_STORAGE_PUBLIC_BASE_URL:}
    access-key-id: ${TAMAKA_STORAGE_ACCESS_KEY_ID:}
    secret-access-key: ${TAMAKA_STORAGE_SECRET_ACCESS_KEY:}
  # Bus de eventos (tamaka-common). "http": POST a /internal/eventos de cada suscriptor;
  # "log": solo registra. El secreto debe ser el mismo en todos los servicios (vacio = fail closed).
  eventos:
    transporte: ${TAMAKA_EVENTOS_TRANSPORTE:http}
    secreto: ${TAMAKA_EVENTOS_SECRETO:}
    timeout: 5s
    reintentos: 3
    suscriptores:
      EventoPublicado: ${RECOMENDACIONES_URL:http://localhost:8088}/internal/eventos
      EventoDesactivado: ${RECOMENDACIONES_URL:http://localhost:8088}/internal/eventos
    # Outbox transaccional: el evento se guarda con el cambio de estado y el relay lo entrega con reintentos.
    outbox:
      habilitado: ${TAMAKA_OUTBOX_HABILITADO:true}
      almacen: jdbc
      tabla: eventos.outbox_evento
      lote: 50
      intervalo: PT2S
      espera-base: PT2S
      espera-maxima: PT10M
      max-intentos: 10
