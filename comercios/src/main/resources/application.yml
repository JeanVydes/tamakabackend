server:
  port: ${PORT:8082}

spring:
  application:
    name: comercios
  datasource:
    # DB_URL completa, o bien DB_HOST/DB_PORT/DB_NAME (Render las inyecta desde el Blueprint).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tamaka}}
    username: ${DB_USER:tamaka_comercios}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: comercios
  flyway:
    schemas: comercios

tamaka:
  security:
    jwt:
      issuer: tamaka-cuentas
      public-key: ${TAMAKA_JWT_PUBLIC_KEY:}
  # Bus de eventos (tamaka-common). "http": POST a /internal/eventos de cada suscriptor;
  # "log": solo registra. El secreto debe ser el mismo en todos los servicios (vacio = fail closed).
  eventos:
    transporte: ${TAMAKA_EVENTOS_TRANSPORTE:http}
    secreto: ${TAMAKA_EVENTOS_SECRETO:}
    timeout: 5s
    reintentos: 3
    suscriptores:
      ServicioDesactivado: ${RESERVAS_URL:http://localhost:8085}/internal/eventos,${RECOMENDACIONES_URL:http://localhost:8088}/internal/eventos
      ServicioCreado: ${RECOMENDACIONES_URL:http://localhost:8088}/internal/eventos
      ServicioActualizado: ${RECOMENDACIONES_URL:http://localhost:8088}/internal/eventos
    # Outbox transaccional: el evento se guarda con el cambio de estado y el relay lo entrega con reintentos.
    outbox:
      habilitado: ${TAMAKA_OUTBOX_HABILITADO:true}
      almacen: jdbc
      tabla: comercios.outbox_evento
      lote: 50
      intervalo: PT2S
      espera-base: PT2S
      espera-maxima: PT10M
      max-intentos: 10
