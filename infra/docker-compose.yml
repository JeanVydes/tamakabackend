# Solo los almacenes de datos, para ejecutar los 10 microservicios desde el IDE o con `mvn spring-boot:run`.
# Para levantar TODO en contenedores (almacenes + microservicios + gateway), use el docker-compose.yml de la raiz.
#
# Uso:
#   ./infra/generar-secretos.sh                                  # crea el .env de la raiz
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
#
# El --env-file es necesario: compose busca el .env en el directorio del compose (infra/),
# pero el ours vive en la raiz. Las variables llegan al contenedor por env_file y por
# POSTGRES_PASSWORD (mapeada desde POSTGRES_ADMIN_PASSWORD).
services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    env_file: [../.env]
    environment:
      POSTGRES_DB: tamaka
      POSTGRES_USER: tamaka_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Defina POSTGRES_ADMIN_PASSWORD en el .env de la raiz}
    ports:
      # 5433 en el host: 5432 suele estar ocupado por una instalacion local de PostgreSQL.
      - "5433:5432"
    volumes:
      - ./postgres/01-esquemas.sh:/docker-entrypoint-initdb.d/01-esquemas.sh:ro
      - postgres-datos:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamaka_admin -d tamaka"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-datos:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres-datos: {}
  mongo-datos: {}
