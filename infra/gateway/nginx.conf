# Gateway de TAMAKA: entrada unica que enruta /api/** al microservicio dueno de cada ruta.
# La validacion JWT la hace cada servicio (arquitectura sec. 8.2); aqui solo se enruta y se bloquea lo interno.
# Para TLS, ponga delante un proxy con certificados (Caddy, Traefik o el balanceador del proveedor).
#
# DNS interno de Docker: los nombres se resuelven en cada peticion (un servicio reiniciado cambia de IP).
# Con "resolve" los upstreams se actualizan sin recargar nginx y ademas se pueden reutilizar las conexiones.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream cuentas        { server cuentas:8081 resolve;        keepalive 32; }
upstream comercios      { server comercios:8082 resolve;      keepalive 32; }
upstream atractivos     { server atractivos:8083 resolve;     keepalive 32; }
upstream eventos        { server eventos:8084 resolve;        keepalive 32; }
upstream reservas       { server reservas:8085 resolve;       keepalive 32; }
upstream pagos          { server pagos:8086 resolve;          keepalive 32; }
upstream preferencias   { server preferencias:8087 resolve;   keepalive 32; }
upstream recomendaciones { server recomendaciones:8088 resolve; keepalive 32; }
upstream notificaciones { server notificaciones:8089 resolve; keepalive 32; }
upstream indicadores    { server indicadores:8090 resolve;    keepalive 32; }

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Bus de eventos: solo red interna. Nunca se expone.
    location /internal/ { return 404; }

    location /api/auth/             { proxy_pass http://cuentas; }
    location /api/cuentas           { proxy_pass http://cuentas; }
    location /api/admin/cuentas     { proxy_pass http://cuentas; }

    location /api/comercios         { proxy_pass http://comercios; }
    location /api/servicios         { proxy_pass http://comercios; }

    location /api/atractivos        { proxy_pass http://atractivos; }
    location /api/alertas           { proxy_pass http://atractivos; }

    location /api/eventos           { proxy_pass http://eventos; }

    location /api/reservas          { proxy_pass http://reservas; }
    location /api/operador/reservas { proxy_pass http://reservas; }
    location /api/admin/reservas    { proxy_pass http://reservas; }

    location /api/pagos             { proxy_pass http://pagos; }
    location /api/operador/pagos    { proxy_pass http://pagos; }
    location /api/admin/pagos       { proxy_pass http://pagos; }

    location /api/preferencias      { proxy_pass http://preferencias; }
    location /api/favoritos         { proxy_pass http://preferencias; }

    location /api/recomendaciones   { proxy_pass http://recomendaciones; }

    location /api/notificaciones    { proxy_pass http://notificaciones; }

    location /api/indicadores          { proxy_pass http://indicadores; }
    location /api/operador/indicadores { proxy_pass http://indicadores; }

    location / {
        default_type application/json;
        return 404 '{"status":404,"error":"Not Found","message":"Ruta no encontrada","details":{}}';
    }
}
