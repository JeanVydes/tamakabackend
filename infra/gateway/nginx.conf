# Gateway de TAMAKA: entrada unica que enruta /api/** al microservicio dueno de cada ruta.
# La validacion JWT la hace cada servicio (arquitectura sec. 8.2); aqui solo se enruta y se bloquea lo interno.
# Para TLS, ponga delante un proxy con certificados (Caddy, Traefik o el balanceador del proveedor).

# DNS interno de Docker: los nombres se resuelven en cada peticion (un servicio reiniciado cambia de IP).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Bus de eventos: solo red interna. Nunca se expone.
    location /internal/ { return 404; }

    location /api/auth/             { set $destino http://cuentas:8081;         proxy_pass $destino; }
    location /api/cuentas           { set $destino http://cuentas:8081;         proxy_pass $destino; }
    location /api/admin/cuentas     { set $destino http://cuentas:8081;         proxy_pass $destino; }

    location /api/comercios         { set $destino http://comercios:8082;       proxy_pass $destino; }
    location /api/servicios         { set $destino http://comercios:8082;       proxy_pass $destino; }

    location /api/atractivos        { set $destino http://atractivos:8083;      proxy_pass $destino; }
    location /api/alertas           { set $destino http://atractivos:8083;      proxy_pass $destino; }

    location /api/eventos           { set $destino http://eventos:8084;         proxy_pass $destino; }

    location /api/reservas          { set $destino http://reservas:8085;        proxy_pass $destino; }
    location /api/operador/reservas { set $destino http://reservas:8085;        proxy_pass $destino; }
    location /api/admin/reservas    { set $destino http://reservas:8085;        proxy_pass $destino; }

    location /api/pagos             { set $destino http://pagos:8086;           proxy_pass $destino; }
    location /api/operador/pagos    { set $destino http://pagos:8086;           proxy_pass $destino; }
    location /api/admin/pagos       { set $destino http://pagos:8086;           proxy_pass $destino; }

    location /api/preferencias      { set $destino http://preferencias:8087;    proxy_pass $destino; }
    location /api/favoritos         { set $destino http://preferencias:8087;    proxy_pass $destino; }

    location /api/recomendaciones   { set $destino http://recomendaciones:8088; proxy_pass $destino; }

    location /api/notificaciones    { set $destino http://notificaciones:8089;  proxy_pass $destino; }

    location /api/indicadores          { set $destino http://indicadores:8090;  proxy_pass $destino; }
    location /api/operador/indicadores { set $destino http://indicadores:8090;  proxy_pass $destino; }

    location / {
        default_type application/json;
        return 404 '{"status":404,"error":"Not Found","message":"Ruta no encontrada","details":{}}';
    }
}
