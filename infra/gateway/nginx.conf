# Gateway de TAMAKA: entrada unica que enruta /api/** al microservicio dueno de cada ruta.
# La validacion JWT la hace cada servicio (arquitectura sec. 8.2); aqui solo se enruta, se bloquea lo interno
# y se responde CORS para el frontend en produccion.
# Para TLS, ponga delante un proxy con certificados (Caddy, Traefik o el balanceador del proveedor).
#
# CORS: se permite cualquier origen (*). El API autentica con JWT en Authorization (no cookies),
# asi que el navegador acepta respuestas con "*" (Access-Control-Allow-Credentials NO se envia).
# Cualquier sitio podra llamar al API desde el navegador; el control de acceso lo hacen los servicios.
#
# DNS interno de Docker: los nombres se resuelven en cada peticion (un servicio reiniciado cambia de IP).
# Con "resolve" los upstreams se actualizan sin recargar nginx y ademas se pueden reutilizar las conexiones.
# "resolve" exige que el upstream viva en memoria compartida: por eso cada bloque declara "zone".
resolver 127.0.0.11 valid=10s ipv6=off;

upstream cuentas        { zone cuentas 64k;        server cuentas:8081 resolve;        keepalive 32; }
upstream comercios      { zone comercios 64k;      server comercios:8082 resolve;      keepalive 32; }
upstream atractivos     { zone atractivos 64k;     server atractivos:8083 resolve;     keepalive 32; }
upstream eventos        { zone eventos 64k;        server eventos:8084 resolve;        keepalive 32; }
upstream reservas       { zone reservas 64k;       server reservas:8085 resolve;       keepalive 32; }
upstream pagos          { zone pagos 64k;          server pagos:8086 resolve;          keepalive 32; }
upstream preferencias   { zone preferencias 64k;   server preferencias:8087 resolve;   keepalive 32; }
upstream recomendaciones { zone recomendaciones 64k; server recomendaciones:8088 resolve; keepalive 32; }
upstream notificaciones { zone notificaciones 64k; server notificaciones:8089 resolve; keepalive 32; }
upstream indicadores    { zone indicadores 64k;    server indicadores:8090 resolve;    keepalive 32; }

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Bus de eventos: solo red interna. Nunca se expone.
    location /internal/ { return 404; }

    # Cabecera CORS en todas las respuestas (incluidos errores 4xx/5xx de los servicios).
    add_header Access-Control-Allow-Origin * always;

    location /api/auth/             { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://cuentas; }
    location /api/cuentas           { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://cuentas; }
    location /api/admin/cuentas     { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://cuentas; }

    location /api/comercios         { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://comercios; }
    location /api/servicios         { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://comercios; }

    location /api/atractivos        { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://atractivos; }
    location /api/alertas           { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://atractivos; }

    location /api/eventos           { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://eventos; }

    location /api/reservas          { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://reservas; }
    location /api/operador/reservas { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://reservas; }
    location /api/admin/reservas    { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://reservas; }

    location /api/pagos             { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://pagos; }
    location /api/operador/pagos    { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://pagos; }
    location /api/admin/pagos       { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://pagos; }

    location /api/preferencias      { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://preferencias; }
    location /api/favoritos         { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://preferencias; }

    location /api/recomendaciones   { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://recomendaciones; }

    location /api/notificaciones    { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://notificaciones; }

    location /api/indicadores          { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://indicadores; }
    location /api/operador/indicadores { include /etc/nginx/snippets/cors-preflight.inc; proxy_pass http://indicadores; }

    location / {
        default_type application/json;
        return 404 '{"status":404,"error":"Not Found","message":"Ruta no encontrada","details":{}}';
    }
}
