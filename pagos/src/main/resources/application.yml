server:
  port: ${PORT:8086}

spring:
  application:
    name: pagos
  datasource:
    # DB_URL completa, o bien DB_HOST/DB_PORT/DB_NAME (Render las inyecta desde el Blueprint).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tamaka}}
    username: ${DB_USER:tamaka_pagos}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pagos
  flyway:
    schemas: pagos

tamaka:
  security:
    jwt:
      issuer: tamaka-cuentas
      public-key: ${TAMAKA_JWT_PUBLIC_KEY:}
  pagos:
    # Secreto compartido con la pasarela para firmar los webhooks. Vacio = se rechazan todos (fail closed).
    webhook-secret: ${PAGOS_WEBHOOK_SECRET:}
    # Mock/sandbox: true = al iniciar el pago se aprueba al instante (sin urlPago ni webhook) y
    # Reservas confirma por el evento PagoAprobado. Poner TAMAKA_PAGOS_APROBACION_AUTOMATICA=false
    # al integrar una pasarela real.
    aprobacion-automatica: ${TAMAKA_PAGOS_APROBACION_AUTOMATICA:true}
  # Bus de eventos (tamaka-common). "http": POST a /internal/eventos de cada suscriptor;
  # "log": solo registra. El secreto debe ser el mismo en todos los servicios (vacio = fail closed).
  eventos:
    transporte: ${TAMAKA_EVENTOS_TRANSPORTE:http}
    secreto: ${TAMAKA_EVENTOS_SECRETO:}
    timeout: 5s
    reintentos: 3
    suscriptores:
      PagoAprobado: ${RESERVAS_URL:http://localhost:8085}/internal/eventos,${NOTIFICACIONES_URL:http://localhost:8089}/internal/eventos,${INDICADORES_URL:http://localhost:8090}/internal/eventos
      PagoRechazado: ${NOTIFICACIONES_URL:http://localhost:8089}/internal/eventos
    # Outbox transaccional: el evento se guarda con el cambio de estado y el relay lo entrega con reintentos.
    outbox:
      habilitado: ${TAMAKA_OUTBOX_HABILITADO:true}
      almacen: jdbc
      tabla: pagos.outbox_evento
      lote: 50
      intervalo: PT2S
      espera-base: PT2S
      espera-maxima: PT10M
      max-intentos: 10
